name: Verificar actualización automática entre usuarios
on:
  workflow_dispatch:
    inputs:
      browser_only:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: arka-qa
  cancel-in-progress: false
jobs:
  events:
    if: ${{ !inputs.browser_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wait-sync.mjs
      - name: Comprobar avisos privados entre tres sesiones reales
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/smoke.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node scripts/wait-sync.mjs
      - name: Comprobar actualizaciones sin recargar ni borrar formularios
        run: node scripts/sync-ui-check.mjs
