name: Comprobar figuras con navegador del servidor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: google-chrome --version
      - run: npm install --no-save --package-lock=false playwright
      - run: node scripts/wait-announcements.mjs
      - name: Verificar siete figuras, textos largos y móvil
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: node scripts/announcements-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anuncios-tematicos
          path: qa-announcements/
