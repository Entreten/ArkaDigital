name: Verificar nuevas cargas pendientes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arka-qa
  cancel-in-progress: false
jobs:
  assignments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wait-upload.mjs
      - name: Comprobar cupos y correcciones sin cargas duplicadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/smoke.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node scripts/wait-upload.mjs
      - name: Reproducir Netflix completado y Prime Video pendiente
        run: node scripts/upload-ui-check.mjs
