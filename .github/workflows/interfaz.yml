name: Verificar interfaz adaptable y temas
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Probar tamaños reales, fondos y música
        run: node scripts/ui-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interfaz-arka-digital
          path: qa-ui/
          if-no-files-found: ignore
