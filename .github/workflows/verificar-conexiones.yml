name: Verificar Render y Supabase
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar acceso sin mostrar credenciales
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request, urllib.error
          checks = [
              ('Render', 'RENDER_API_KEY', 'https://api.render.com/v1/services?limit=1'),
              ('Supabase', 'SUPABASE_ACCESS_TOKEN', 'https://api.supabase.com/v1/projects'),
          ]
          failed = False
          lines = ['# Comprobacion de acceso', '', 'Esta prueba solo consulta las API; no crea ni modifica recursos.', '']
          for name, key, url in checks:
              token = os.environ.get(key, '').strip()
              if not token:
                  message = f'{name}: falta configurar el secreto {key}.'
                  failed = True
              else:
                  request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json', 'User-Agent': 'ARKA-DIGITAL-Connection-Check'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          status = response.status
                          json.load(response)
                      message = f'{name}: acceso de lectura confirmado (HTTP {status}).'
                  except urllib.error.HTTPError as error:
                      message = f'{name}: acceso no confirmado (HTTP {error.code}). Revisa los permisos y la vigencia del secreto.'
                      failed = True
                  except Exception:
                      message = f'{name}: no se pudo completar la comprobacion; no se imprimen detalles para proteger los datos.'
                      failed = True
              print(message)
              lines.append('- ' + message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          sys.exit(1 if failed else 0)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspeccionar estructura y totales sin modificar datos
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/audit-readonly.mjs
