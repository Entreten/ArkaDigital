name: Validar flujos de ARKA DIGITAL
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arka-qa
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activar Navidad y limpiar pruebas anteriores
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/christmas.mjs
      - name: Verificar flujos reales con datos temporales
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/smoke.mjs
